name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13   # Intel x86_64
            arch: x86_64
          - runner: macos-15   # Apple Silicon (arm64)
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip3 install pyinstaller

      - name: Build executable
        run: |
          python3 -m PyInstaller --noconfirm --onefile --windowed --clean \
            --name "CursorSandTool-${{ matrix.arch }}" \
            --add-data "cursor_sand_min.py:." \
            --add-data "license_gate.py:." \
            --add-data "ed25519_pure.py:." \
            --hidden-import ed25519_pure \
            cursor_sand_gui.py

      - name: Wrap as .app bundle
        run: |
          APP="dist/CursorSandTool-${{ matrix.arch }}.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "dist/CursorSandTool-${{ matrix.arch }}" "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/CursorSandTool-${{ matrix.arch }}"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>CursorSandTool-${{ matrix.arch }}</string>
            <key>CFBundleIdentifier</key><string>com.cursorsand.tool</string>
            <key>CFBundleName</key><string>CursorSandTool</string>
            <key>CFBundleDisplayName</key><string>Cursor Sand Tool</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          # 压缩成 zip 方便下载
          cd dist && zip -r "CursorSandTool-${{ matrix.arch }}.zip" "CursorSandTool-${{ matrix.arch }}.app" "CursorSandTool-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursorSandTool-${{ matrix.arch }}
          path: |
            dist/CursorSandTool-${{ matrix.arch }}
            dist/CursorSandTool-${{ matrix.arch }}.zip
          if-no-files-found: error
